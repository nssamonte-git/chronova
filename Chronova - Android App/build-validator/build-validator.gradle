// Mobile build validator: Gradle hook.
//
// Apply it from the app module's build file, after the plugins block:
//   build.gradle      apply from: "$rootDir/build-validator/build-validator.gradle"
//   build.gradle.kts  apply(from = "$rootDir/build-validator/build-validator.gradle")
//
// Every variant then runs :app:validateThreats before preBuild, so assemble*,
// bundle*, install* and Android Studio "Run" stop while the scan reports
// blocking findings. The JSON report is written to
// app/build/reports/build-validator/report.json.

def bvScript = ["${rootDir}/build-validator", "${rootDir}/../build-validator"]
        .collect { file("${it}/validate-build.sh") }
        .find { it.exists() }
if (bvScript == null) {
    throw new GradleException("Mobile build validator: build-validator/validate-build.sh was not found next to this project. Re-run install.sh.")
}
// The scan is a POSIX shell script (sh, sed, grep, sort...). macOS and Linux have them; on Windows
// it needs Git for Windows' bash, which brings those tools. Look in Git's usual install folders
// before PATH, so neither a PATH setting nor WSL's System32\bash.exe (Linux paths) is used by mistake.
def bvShell = "sh"
// Git's own tools folder (usr\bin), put first on PATH so the scan's find and sort are Git's, not
// Windows' commands of the same name (System32\find.exe, sort.exe) when bash came from PATH.
def bvToolsDir = null
if (System.getProperty("os.name").toLowerCase().contains("windows")) {
    def env = System.getenv()
    def gitBash = [
            env["ProgramFiles"], env["ProgramW6432"], env["ProgramFiles(x86)"],
            env["LOCALAPPDATA"] ? "${env["LOCALAPPDATA"]}\\Programs" : null,
    ].findAll { it }.collect { file("${it}\\Git\\bin\\bash.exe") }.find { it.exists() }
    def onPath = (env["PATH"] ?: env["Path"] ?: "").split(File.pathSeparator)
            .findAll { it && !it.toLowerCase().contains("system32") }
            .collect { new File(it, "bash.exe") }.find { it.exists() }
    def found = gitBash ?: onPath
    if (found == null) {
        throw new GradleException("Mobile build validator: Git for Windows' bash.exe was not found (it runs the security scan before every build). Install Git for Windows (https://git-scm.com/download/win) and build again.")
    }
    bvShell = found.absolutePath
    def gitRoot = found.parentFile.name.equalsIgnoreCase("bin") && found.parentFile.parentFile.name.equalsIgnoreCase("usr")
            ? found.parentFile.parentFile.parentFile : found.parentFile.parentFile
    bvToolsDir = [new File(gitRoot, "usr\\bin"), found.parentFile].find { new File(it, "find.exe").exists() }
}
// Paths for the shell with forward slashes: Git Bash reads C:/... paths, and dirname (used to find the
// script's folder and to create the report's) splits them; it doesn't split on backslashes.
def bvPath = { File f -> f.absolutePath.replace('\\', '/') }
def bvReport = layout.buildDirectory.file("reports/build-validator/report.json").get().asFile

def validateThreats = tasks.register("validateThreats", Exec) {
    group = "verification"
    description = "Scans the project source for known mobile threats and fails on blocking findings."
    workingDir bvScript.parentFile
    commandLine bvShell, bvPath(bvScript), "--report", bvPath(bvReport)
    if (bvToolsDir != null) {
        def pathKey = System.getenv().keySet().find { it.equalsIgnoreCase("PATH") } ?: "PATH"
        environment(pathKey, bvToolsDir.absolutePath + File.pathSeparator + (System.getenv(pathKey) ?: ""))
    }
    outputs.upToDateWhen { false }
    // The scan creates the report's folder too; made here as well, so a fresh clone never depends on it.
    doFirst { bvReport.parentFile.mkdirs() }
}

tasks.matching { it.name == "preBuild" }.configureEach { dependsOn(validateThreats) }
