# Android app checks. Same commands as locally: tools/check.sh (see HANDOFF).
name: Android

on:
  push:
    paths:
      - "Chronova - Android App/**"
      - "tools/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "Chronova - Android App/**"
      - "tools/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Unit tests, lint, architecture, screenshots
    # macOS, like the Mac the screenshot references were recorded on, so they render the same.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check
        run: tools/check.sh
      - name: Keep the reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            Chronova - Android App/build/reports/
            Chronova - Android App/**/build/reports/

  device-tests:
    name: Device tests on the managed emulator
    # Linux with KVM: GitHub's macOS runners can't run an Android emulator.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v4
      - name: Device tests
        env:
          # No screen on the runner: software rendering.
          CHECK_GRADLE_ARGS: -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
        run: tools/check.sh --devices-only
      - name: Keep the reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports
          path: |
            Chronova - Android App/build/reports/
            Chronova - Android App/**/build/reports/androidTests/
            Chronova - Android App/**/build/outputs/androidTest-results/
